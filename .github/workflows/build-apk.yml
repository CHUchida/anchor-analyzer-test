name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flet
        pip install pillow
    
    - name: Build APK with verbosity
      run: |
        flet pack anchor_flet_app.py \
          --name AnalisadorAncoragens \
          --package-name com.ancoragem.analyzer \
          --version 1.0.0 \
          --verbose
    
    - name: List all files
      run: |
        echo "=== Current directory ==="
        ls -la
        echo "=== Search for any APK ==="
        find . -type f -name "*.apk" || echo "No APK found"
        echo "=== Search for build folders ==="
        find . -type d -name "build" -o -name "dist" -o -name "outputs" | head -20
    
    - name: Upload any file (debug)
      uses: actions/upload-artifact@v4
      with:
        name: Debug-Files
        path: |
          .
          **/dist/**
          **/build/**

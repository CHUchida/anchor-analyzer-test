name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet
    
    - name: Verify Flet installation
      run: |
        python -c "import flet; print(f'Flet version: {flet.__version__}')"
        which flet || echo "flet not in PATH"
        python -c "import sys; print(sys.executable)"
    
    - name: Build APK
      run: |
        # Usa o comando flet diretamente (sem python -m)
        flet pack anchor_flet_app.py \
          --name AnalisadorAncoragens \
          --package-name com.ancoragem.analyzer \
          --version 1.0.0
    
    - name: List generated files
      run: |
        echo "=== Current directory ==="
        ls -la
        echo "=== Searching for APK ==="
        find . -name "*.apk" || echo "No APK found"
        find . -name "*.aab" || echo "No AAB found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AnalisadorAncoragens-APK
        path: |
          *.apk
          **/build/**/*.apk
          **/outputs/**/*.apk
        if-no-files-found: warn
